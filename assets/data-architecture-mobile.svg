<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1735" width="420" height="1735" role="img" aria-labelledby="title desc"><title id="title">Arquitetura de dados proposta</title><desc id="desc">Seis módulos. Fontes verificadas pelo inventário em M0. Ingestão, armazenamento, processamento, camada analítica e consumo estão planejados para M1 a M5.</desc><rect width="420" height="1735" rx="18" fill="#10101E"/><style>text{font-family:Inter,Arial,sans-serif}.ey{font-size:12px;font-weight:700;fill:#A78BFA}.head{font-size:16px;font-weight:700;fill:#F8FAFC}.status{font-size:11px;font-weight:700;fill:#C4B5FD}.ok{fill:#5EEAD4}.item{font-size:13px;fill:#E2E8F0}.foot{font-size:12px;fill:#CBD5E1}.bar{font-size:13px;font-weight:700;fill:#C4B5FD}</style><g><rect x="18" y="20" width="384" height="258" rx="12" fill="#102627" stroke="#255D58" stroke-width="1.5"/><rect x="18" y="20" width="384" height="4" rx="2" fill="#5EEAD4"/><text x="34" y="51" class="ey">01  CATÁLOGO PÚBLICO</text><text x="34" y="87" class="head">Fontes de dados</text><text x="34" y="113" class="status ok">VERIFICADO · M0</text><rect x="32" y="135" width="356" height="31" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="45" cy="150.5" r="3" fill="#5EEAD4"/><text x="57" y="155" class="item">Portal PBH / CKAN</text><rect x="32" y="172" width="356" height="31" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="45" cy="187.5" r="3" fill="#5EEAD4"/><text x="57" y="192" class="item">Ocorrências · pessoas</text><rect x="32" y="209" width="356" height="31" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="45" cy="224.5" r="3" fill="#5EEAD4"/><text x="57" y="229" class="item">Veículos · logradouros</text><text x="34" y="265" class="foot">Inventário documentado</text></g><g><rect x="18" y="300" width="384" height="258" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="18" y="300" width="384" height="4" rx="2" fill="#A78BFA"/><text x="34" y="331" class="ey">02  ACESSO POR RECURSO</text><text x="34" y="367" class="head">Ingestão</text><text x="34" y="393" class="status ">PLANEJADO · M1</text><rect x="32" y="415" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="430.5" r="3" fill="#A78BFA"/><text x="57" y="435" class="item">DataStore ou arquivo</text><rect x="32" y="452" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="467.5" r="3" fill="#A78BFA"/><text x="57" y="472" class="item">Captura e metadados</text><rect x="32" y="489" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="504.5" r="3" fill="#A78BFA"/><text x="57" y="509" class="item">Hash SHA-256</text><text x="34" y="545" class="foot">Rotina ainda inexistente</text></g><g><rect x="18" y="580" width="384" height="258" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="18" y="580" width="384" height="4" rx="2" fill="#A78BFA"/><text x="34" y="611" class="ey">03  CAMADAS DE DADOS</text><text x="34" y="647" class="head">Armazenamento</text><text x="34" y="673" class="status ">PLANEJADO · M1–M2</text><rect x="32" y="695" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="710.5" r="3" fill="#A78BFA"/><text x="57" y="715" class="item">Raw de origem</text><rect x="32" y="732" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="747.5" r="3" fill="#A78BFA"/><text x="57" y="752" class="item">Bronze após profiling</text><rect x="32" y="769" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="784.5" r="3" fill="#A78BFA"/><text x="57" y="789" class="item">Silver após validação</text><text x="34" y="825" class="foot">Parquet a decidir</text></g><g><rect x="18" y="860" width="384" height="258" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="18" y="860" width="384" height="4" rx="2" fill="#A78BFA"/><text x="34" y="891" class="ey">04  QUALIDADE</text><text x="34" y="927" class="head">Processamento</text><text x="34" y="953" class="status ">PLANEJADO · M2</text><rect x="32" y="975" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="990.5" r="3" fill="#A78BFA"/><text x="57" y="995" class="item">Esquema e tipos</text><rect x="32" y="1012" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="1027.5" r="3" fill="#A78BFA"/><text x="57" y="1032" class="item">Nulos e duplicidades</text><rect x="32" y="1049" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="1064.5" r="3" fill="#A78BFA"/><text x="57" y="1069" class="item">Contagens reconciliadas</text><text x="34" y="1105" class="foot">Regras após profiling</text></g><g><rect x="18" y="1140" width="384" height="258" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="18" y="1140" width="384" height="4" rx="2" fill="#A78BFA"/><text x="34" y="1171" class="ey">05  SQL E ANÁLISE</text><text x="34" y="1207" class="head">Camada analítica</text><text x="34" y="1233" class="status ">PLANEJADO · M3–M4</text><rect x="32" y="1255" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="1270.5" r="3" fill="#A78BFA"/><text x="57" y="1275" class="item">Chaves e granularidade</text><rect x="32" y="1292" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="1307.5" r="3" fill="#A78BFA"/><text x="57" y="1312" class="item">PostgreSQL / SQL</text><rect x="32" y="1329" width="356" height="31" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="45" cy="1344.5" r="3" fill="#A78BFA"/><text x="57" y="1349" class="item">Indicadores auditáveis</text><text x="34" y="1385" class="foot">Modelo ainda não criado</text></g><g><rect x="18" y="1420" width="384" height="258" rx="12" fill="#12282A" stroke="#275B58" stroke-width="1.5"/><rect x="18" y="1420" width="384" height="4" rx="2" fill="#2DD4BF"/><text x="34" y="1451" class="ey">06  COMUNICAÇÃO</text><text x="34" y="1