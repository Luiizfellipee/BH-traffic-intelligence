<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 338" width="1440" height="338" role="img" aria-labelledby="title desc"><title id="title">Visão geral do pipeline</title><desc id="desc">Descoberta verificada em M0, seguida de cinco etapas planejadas de M1 a M5. As setas mostram a sequência proposta.</desc><rect width="1440" height="338" rx="18" fill="#071724"/><style>text{font-family:Inter,Arial,sans-serif}.num{font-size:13px;font-weight:700;fill:#65B9FF}.ttl{font-size:18px;font-weight:700;fill:#F1F5F9}.status{font-size:11px;font-weight:700;fill:#A9BDD1}.ok{fill:#5EEAD4}.body{font-size:14px;fill:#CAD9E7}.mini{font-size:12px;font-weight:700;fill:#65B9FF}.sub{font-size:13px;fill:#E2E8F0}</style><g><rect x="18" y="32" width="221" height="184" rx="11" fill="#092033" stroke="#16405F"/><text x="34" y="57" class="num">01</text><g transform="translate(205 64)" fill="none" stroke="#5EEAD4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="9"/><path d="M7 7 15 15"/></g><text x="34" y="105" class="ttl">Descoberta</text><text x="34" y="130" class="status ok">VERIFICADO · M0</text><text x="34" y="155" class="body">Catálogo CKAN e quatro</text><text x="34" y="175" class="body">coleções inventariadas.</text><rect x="18" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="34" y="256" class="mini">Entrada</text><text x="34" y="282" class="sub">Metadados e recursos</text></g><g><rect x="255" y="32" width="221" height="184" rx="11" fill="#092033" stroke="#16405F"/><text x="271" y="57" class="num">02</text><g transform="translate(442 64)" fill="none" stroke="#65B9FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13v19m-7-7 7 7 7-7M-12 10v4h24v-4"/></g><text x="271" y="105" class="ttl">Ingestão</text><text x="271" y="130" class="status ">PLANEJADO · M1</text><text x="271" y="155" class="body">Acesso por recurso,</text><text x="271" y="175" class="body">snapshot e SHA-256.</text><rect x="255" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="271" y="256" class="mini">Saída prevista</text><text x="271" y="282" class="sub">Arquivos + manifesto</text></g><g><rect x="492" y="32" width="221" height="184" rx="11" fill="#092033" stroke="#16405F"/><text x="508" y="57" class="num">03</text><g transform="translate(679 64)" fill="none" stroke="#65B9FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -14 12-9v9c0 9-6 13-12 15C-6 13-12 9-12 0v-9Z"/><path d="m-6 0 4 4 8-9"/></g><text x="508" y="105" class="ttl">Qualidade</text><text x="508" y="130" class="status ">PLANEJADO · M2</text><text x="508" y="155" class="body">Profiling de esquema,</text><text x="508" y="175" class="body">tipos e duplicidades.</text><rect x="492" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="508" y="256" class="mini">Verificações</text><text x="508" y="282" class="sub">Regras e reconciliação</text></g><g><rect x="729" y="32" width="221" height="184" rx="11" fill="#062631" stroke="#14515C"/><text x="745" y="57" class="num">04</text><g transform="translate(916 64)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m-12-7 12-6 12 6-12 6-12-6Zm0 8 12 6L12 1M-12 8l12 6 12-6"/></g><text x="745" y="105" class="ttl">Transformação</text><text x="745" y="130" class="status ">PLANEJADO · M2</text><text x="745" y="155" class="body">Padronização após</text><text x="745" y="175" class="body">inspeção dos dados.</text><rect x="729" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="745" y="256" class="mini">Camadas previstas</text><text x="745" y="282" class="sub">Bronze e Silver</text></g><g><rect x="966" y="32" width="221" height="184" rx="11" fill="#062631" stroke="#14515C"/><text x="982" y="57" class="num">05</text><g transform="translate(1153 64)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-9" rx="11" ry="4"/><path d="M-11-9V9c0 5 22 5 22 0V-9M-11 0c0 5 22 5 22 0"/></g><text x="982" y="105" class="ttl">Camada analítica</text><text x="982" y="130" class="status ">PLANEJADO · M3–M4</text><text x="982" y="155" class="body">Modelo SQL e análise</text><text x="982" y="175" class="body">com denominadores.</text><rect x="966" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="982" y="256" class="mini">Entregáveis</text><text x="982" y="282" class="sub">Consultas e indicadores</text></g><g><rect x="1203" y="32" width="221" height="184" rx="11" fill="#062631" stroke="#14515C"/><text x="1219" y="57" class="num">06</text><g transform="translate(1390 64)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 13V2h5v11M-2 13V-6h5v19M8 13v-25h5v25"/></g><text x="1219" y="105" class="ttl">Consumo</text><text x="1219" y="130" class="status ">PLANEJADO · M5</text><text x="1219" y="155" class="body">Visualização com</text><text x="1219" y="175" class="body">método e limites.</text><rect x="1203" y="231" width="221" height="78" rx="10" fill="#102030" stroke="#263F54"/><text x="1219" y="256" class="mini">Apresentação</text><text x="1219" y="282" class="sub">Dashboard e relatório</text></g><path d="M239 129h16m-6-5 6 5-6 5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M476 129h16m-6-5 6 5-6 5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M713 129h16m-6-5 6 5-6 5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M950 129h16m-6-5 6 5-6 5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1187 129h16m-6-5 6 5-6 5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
