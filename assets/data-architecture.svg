<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 585" width="1500" height="585" role="img" aria-labelledby="title desc"><title id="title">Arquitetura de dados proposta</title><desc id="desc">Seis módulos. Fontes verificadas pelo inventário em M0. Ingestão, armazenamento, processamento, camada analítica e consumo estão planejados para M1 a M5.</desc><rect width="1500" height="585" rx="18" fill="#10101E"/><style>text{font-family:Inter,Arial,sans-serif}.ey{font-size:12px;font-weight:700;fill:#A78BFA}.head{font-size:16px;font-weight:700;fill:#F8FAFC}.status{font-size:11px;font-weight:700;fill:#C4B5FD}.ok{fill:#5EEAD4}.item{font-size:13px;fill:#E2E8F0}.foot{font-size:12px;fill:#CBD5E1}.bar{font-size:13px;font-weight:700;fill:#C4B5FD}</style><text x="28" y="30" class="ey">ARQUITETURA PROPOSTA</text><text x="1472" y="30" text-anchor="end" class="foot">M0: inventário verificado  ·  M1–M5: módulos planejados</text><g><rect x="20" y="52" width="225" height="452" rx="12" fill="#102627" stroke="#255D58" stroke-width="1.5"/><rect x="20" y="52" width="225" height="4" rx="2" fill="#5EEAD4"/><text x="36" y="83" class="ey">01  CATÁLOGO PÚBLICO</text><text x="36" y="119" class="head">Fontes de dados</text><text x="36" y="145" class="status ok">VERIFICADO · M0</text><rect x="34" y="177" width="197" height="52" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="47" cy="203" r="3" fill="#5EEAD4"/><text x="59" y="207.5" class="item">Portal PBH / CKAN</text><rect x="34" y="244" width="197" height="52" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="47" cy="270" r="3" fill="#5EEAD4"/><text x="59" y="274.5" class="item">Ocorrências · pessoas</text><rect x="34" y="311" width="197" height="52" rx="7" fill="#173334" stroke="#2E615B"/><circle cx="47" cy="337" r="3" fill="#5EEAD4"/><text x="59" y="341.5" class="item">Veículos · logradouros</text><text x="36" y="471" class="foot">Inventário documentado</text></g><g><rect x="267" y="52" width="225" height="452" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="267" y="52" width="225" height="4" rx="2" fill="#A78BFA"/><text x="283" y="83" class="ey">02  ACESSO POR RECURSO</text><text x="283" y="119" class="head">Ingestão</text><text x="283" y="145" class="status ">PLANEJADO · M1</text><rect x="281" y="177" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="294" cy="203" r="3" fill="#A78BFA"/><text x="306" y="207.5" class="item">DataStore ou arquivo</text><rect x="281" y="244" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="294" cy="270" r="3" fill="#A78BFA"/><text x="306" y="274.5" class="item">Captura e metadados</text><rect x="281" y="311" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="294" cy="337" r="3" fill="#A78BFA"/><text x="306" y="341.5" class="item">Hash SHA-256</text><text x="283" y="471" class="foot">Rotina ainda inexistente</text></g><g><rect x="514" y="52" width="225" height="452" rx="12" fill="#191B30" stroke="#353553" stroke-width="1.5"/><rect x="514" y="52" width="225" height="4" rx="2" fill="#A78BFA"/><text x="530" y="83" class="ey">03  CAMADAS DE DADOS</text><text x="530" y="119" class="head">Armazenamento</text><text x="530" y="145" class="status ">PLANEJADO · M1–M2</text><rect x="528" y="177" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="541" cy="203" r="3" fill="#A78BFA"/><text x="553" y="207.5" class="item">Raw de origem</text><rect x="528" y="244" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="541" cy="270" r="3" fill="#A78BFA"/><text x="553" y="274.5" class="item">Bronze após profiling</text><rect x="528" y="311" width="197" height="52" rx="7" fill="#252A42" stroke="#3B4260"/><circle cx="541" cy="337" r="3" fill="#A78BFA"/><text x="553" y="341.5" class="item">Silver após validação</text><text x="530" y="471" class="foot">Parquet a decidir</text></g><g><rect x="761" y="52" width="225" height="452" rx="12" fill="#19