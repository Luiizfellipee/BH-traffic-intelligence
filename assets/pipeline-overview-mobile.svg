<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1050" width="390" height="1050" role="img" aria-labelledby="title desc"><title id="title">Visão geral do pipeline</title><desc id="desc">Descoberta verificada em M0, seguida de cinco etapas planejadas de M1 a M5. As setas mostram a sequência proposta.</desc><rect width="390" height="1050" rx="18" fill="#071724"/><style>text{font-family:Inter,Arial,sans-serif}.num{font-size:13px;font-weight:700;fill:#65B9FF}.ttl{font-size:18px;font-weight:700;fill:#F1F5F9}.status{font-size:11px;font-weight:700;fill:#A9BDD1}.ok{fill:#5EEAD4}.body{font-size:14px;fill:#CAD9E7}.mini{font-size:12px;font-weight:700;fill:#65B9FF}.sub{font-size:13px;fill:#E2E8F0}</style><g transform="translate(0 0)"><rect x="18" y="20" width="354" height="150" rx="11" fill="#092033" stroke="#16405F"/><text x="34" y="45" class="num">01</text><g transform="translate(338 52)" fill="none" stroke="#5EEAD4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="9"/><path d="M7 7 15 15"/></g><text x="34" y="93" class="ttl">Descoberta</text><text x="34" y="118" class="status ok">VERIFICADO · M0</text><text x="34" y="143" class="body">Catálogo CKAN e quatro</text><text x="34" y="163" class="body">coleções inventariadas.</text></g><g transform="translate(0 8)"><rect x="18" y="184" width="354" height="150" rx="11" fill="#092033" stroke="#16405F"/><text x="34" y="209" class="num">02</text><g transform="translate(338 216)" fill="none" stroke="#65B9FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13v19m-7-7 7 7 7-7M-12 10v4h24v-4"/></g><text x="34" y="257" class="ttl">Ingestão</text><text x="34" y="282" class="status ">PLANEJADO · M1</text><text x="34" y="307" class="body">Acesso por recurso,</text><text x="34" y="327" class="body">snapshot e SHA-256.</text></g><g transform="translate(0 16)"><rect x="18" y="348" width="354" height="150" rx="11" fill="#092033" stroke="#16405F"/><text x="34" y="373" class="num">03</text><g transform="translate(338 380)" fill="none" stroke="#65B9FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -14 12-9v9c0 9-6 13-12 15C-6 13-12 9-12 0v-9Z"/><path d="m-6 0 4 4 8-9"/></g><text x="34" y="421" class="ttl">Qualidade</text><text x="34" y="446" class="status ">PLANEJADO · M2</text><text x="34" y="471" class="body">Profiling de esquema,</text><text x="34" y="491" class="body">tipos e duplicidades.</text></g><g transform="translate(0 24)"><rect x="18" y="512" width="354" height="150" rx="11" fill="#062631" stroke="#14515C"/><text x="34" y="537" class="num">04</text><g transform="translate(338 544)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m-12-7 12-6 12 6-12 6-12-6Zm0 8 12 6L12 1M-12 8l12 6 12-6"/></g><text x="34" y="585" class="ttl">Transformação</text><text x="34" y="610" class="status ">PLANEJADO · M2</text><text x="34" y="635" class="body">Padronização após</text><text x="34" y="655" class="body">inspeção dos dados.</text></g><g transform="translate(0 32)"><rect x="18" y="676" width="354" height="150" rx="11" fill="#062631" stroke="#14515C"/><text x="34" y="701" class="num">05</text><g transform="translate(338 708)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-9" rx="11" ry="4"/><path d="M-11-9V9c0 5 22 5 22 0V-9M-11 0c0 5 22 5 22 0"/></g><text x="34" y="749" class="ttl">Camada analítica</text><text x="34" y="774" class="status ">PLANEJADO · M3–M4</text><text x="34" y="799" class="body">Modelo SQL e análise</text><text x="34" y="819" class="body">com denominadores.</text></g><g transform="translate(0 40)"><rect x="18" y="840" width="354" height="150" rx="11" fill="#062631" stroke="#14515C"/><text x="34" y="865" class="num">06</text><g transform="translate(338 872)" fill="none" stroke="#2DD4BF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 13V2h5v11M-2 13V-6h5v19M8 13v-25h5v25"/></g><text x="34" y="913" class="ttl">Consumo</text><text x="34" y="938" class="status ">PLANEJADO · M5</text><text x="34" y="963" class="body">Visualização com</text><text x="34" y="983" class="body">método e limites.</text></g><path d="M195 171v18m-5-5 5 5 5-5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 343v18m-5-5 5 5 5-5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 515v18m-5-5 5 5 5-5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 687v18m-5-5 5 5 5-5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 859v18m-5-5 5 5 5-5" fill="none" stroke="#65B9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
